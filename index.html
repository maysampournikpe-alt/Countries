<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FlagMaster — Road to 195. Learn every national flag with adaptive spaced repetition." />
    <meta name="theme-color" content="#0b1530" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>FlagMaster — Road to 195</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('flagmaster-v1') || '{}')?.state?.settings?.theme || 'system';
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
